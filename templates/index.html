<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学習記録アプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📚 学習記録アプリ</h1>

        <!-- 入力フォーム -->
        <section class="card">
            <h2>学習記録を追加</h2>
            <form id="record-form">
                <div class="form-group">
                    <label for="subject">科目</label>
                    <input type="text" id="subject" placeholder="例: 数学" required>
                </div>
                <div class="form-group">
                    <label for="minutes">学習時間（分）</label>
                    <input type="number" id="minutes" min="1" placeholder="例: 60" required>
                </div>
                <button type="submit" class="btn-primary">記録する</button>
            </form>
            <div id="message" class="message"></div>
        </section>

        <!-- 合計学習時間 -->
        <section class="card">
            <h2>合計学習時間</h2>
            <div id="total" class="total-display">0分</div>
        </section>

        <!-- 科目ごとの集計 -->
        <section class="card">
            <h2>科目ごとの学習時間</h2>
            <div id="subject-summary" class="subject-summary">
                <p class="empty">記録がありません</p>
            </div>
        </section>

        <!-- 日ごとの集計 -->
        <section class="card">
            <h2>日ごとの学習時間（直近7日間）</h2>
            <div id="daily-summary" class="chart-container">
                <p class="empty">記録がありません</p>
            </div>
        </section>

        <!-- 週ごとの集計 -->
        <section class="card">
            <h2>週ごとの学習時間（直近4週間）</h2>
            <div id="weekly-summary" class="chart-container">
                <p class="empty">記録がありません</p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
